<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oddberry Online World 🍓✨</title>
  <style>
    :root {
      --bg-color: #ffeef2;
      --card-bg: #ffffff;
      --primary: #ff6b8b;
      --primary-hover: #ff4770;
      --accent: #ffd166;
      --text: #4a3e3d;
      --border: #ffcad4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Modal / Customizer Overlay */
    #creator-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 238, 242, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .creator-card {
      background: var(--card-bg);
      border: 4px solid var(--border);
      border-radius: 24px;
      padding: 30px;
      width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(255, 107, 139, 0.2);
    }

    .creator-card h1 {
      color: var(--primary);
      margin-bottom: 8px;
    }

    .creator-card p {
      font-size: 0.9rem;
      margin-bottom: 20px;
      color: #7d6b6d;
    }

    .avatar-preview {
      width: 120px;
      height: 120px;

      border-radius: 50%;
      background: #fff0f3;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px dashed var(--border);
      position: relative;
    }
